name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  workflow_call:
    inputs:
      full:
        description: 'Run full OS x Node matrix'
        required: false
        type: boolean
        default: false

jobs:
  compute-matrix:
    name: Compute matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      name_suffix: ${{ steps.set.outputs.name_suffix }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" != "workflow_call" || "${{ inputs.full }}" == "true" ]]; then
            echo 'matrix={"os":["ubuntu-24.04","windows-latest"],"node":[22,24]}' >> "$GITHUB_OUTPUT"
            echo 'name_suffix=(full matrix)' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"os":["ubuntu-24.04"],"node":[22]}' >> "$GITHUB_OUTPUT"
            echo 'name_suffix=' >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: Units (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: compute-matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Verify test groups
        run: npm run test:inventory
      - name: Units with coverage (no package build)
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 22
        run: npm run test:run -- --selectProjects unit-node unit-dom --ci --coverage --coverageDirectory=coverage/unit
      - name: Units (no package build)
        if: matrix.os != 'ubuntu-24.04' || matrix.node != 22
        run: npm run test:run -- --selectProjects unit-node unit-dom --ci
      - name: Upload unit coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 22
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-unit-${{ matrix.os }}-node${{ matrix.node }}
          path: coverage/unit/coverage-final.json

  build:
    name: Build integrations (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: compute-matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Compiler, CLI and declaration integrations with coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 22
        run: npm run test:run -- --selectProjects build types --ci --maxWorkers=2 --coverage --coverageDirectory=coverage/build
      - name: Compiler, CLI and declaration integrations
        if: matrix.os != 'ubuntu-24.04' || matrix.node != 22
        run: npm run test:run -- --selectProjects build types --ci --maxWorkers=2
      - name: Override builds in isolated sessions
        run: npm run test:run -- --selectProjects build --testPathPatterns=tests/integration/build/override --ci --maxWorkers=2
        env:
          ADNBN_OVERRIDE_BUILD_MODE: session
      - name: Upload build coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 22
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-build-${{ matrix.os }}-node${{ matrix.node }}
          path: coverage/build/coverage-final.json

  fixtures:
    name: Fixture types (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: compute-matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build package, prepare and typecheck every application
        run: npm run typecheck:fixtures

  browser:
    name: Browser (${{ matrix.browser }}, Node ${{ matrix.node }})
    needs: compute-matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.compute-matrix.outputs.matrix).node }}
        browser: [chrome, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Chrome
        if: matrix.browser == 'chrome'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Set up Firefox
        if: matrix.browser == 'firefox'
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Build package
        run: npm run build
      - name: Browser integrations
        run: npm run test:run -- --selectProjects ${{ matrix.browser }} --ci --maxWorkers=2
        env:
          ADNBN_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          ADNBN_FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
      - name: Upload browser startup timings
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-startup-${{ matrix.browser }}-node-${{ matrix.node }}
          path: .cache/integration/browser-startup.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Coverage (ubuntu-24.04, Node 22)
    needs: [compute-matrix, unit, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download unit coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-unit-ubuntu-24.04-node22
          path: coverage/unit
      - name: Download build coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-build-ubuntu-24.04-node22
          path: coverage/build
      - name: Merge source coverage from both groups
        run: node scripts/merge-coverage.mjs coverage/unit/coverage-final.json coverage/build/coverage-final.json
      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-ubuntu-24.04-node22
          path: coverage/merged

  # Keep the existing required check names while the work runs in independent jobs.
  build-and-test:
    name: Test and Build (${{ matrix.os == 'ubuntu-24.04' && 'ubuntu-latest' || matrix.os }}, Node ${{ matrix.node }}) ${{ needs.compute-matrix.outputs.name_suffix }}
    if: ${{ always() && needs.compute-matrix.result == 'success' }}
    needs: [compute-matrix, unit, build, fixtures, browser, coverage]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    steps:
      - name: Require all test groups
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* || "$RESULTS" == *skipped* ]]; then
            exit 1
          fi
