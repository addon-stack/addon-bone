name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  workflow_call:
    inputs:
      full:
        description: 'Run full OS x Node matrix'
        required: false
        type: boolean
        default: false

jobs:
  compute-matrix:
    name: Compute matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      name_suffix: ${{ steps.set.outputs.name_suffix }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" != "workflow_call" || "${{ inputs.full }}" == "true" ]]; then
            echo 'matrix={"os":["ubuntu-latest","windows-latest"],"node":[22,24]}' >> "$GITHUB_OUTPUT"
            echo 'name_suffix=(full matrix)' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"os":["ubuntu-latest"],"node":[22]}' >> "$GITHUB_OUTPUT"
            echo 'name_suffix=' >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Test and Build (${{ matrix.os }}, Node ${{ matrix.node }}) ${{ needs.compute-matrix.outputs.name_suffix }}
    needs: compute-matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Set up Chrome
        if: matrix.os == 'ubuntu-latest'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install dependencies
        run: npm ci

      - name: Set up Firefox
        if: matrix.os == 'ubuntu-latest'
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck integration fixtures
        run: npm run typecheck:integration

      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:ci
        env:
          ADNBN_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          ADNBN_FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}

      # Chrome CDP and Firefox BiDi extension scenarios run on the Linux runner.
      # The rest of the test suite remains part of the full OS x Node matrix.
      - name: Test (non-browser)
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:ci:non-browser

      - name: Build
        run: npm run build

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-node${{ matrix.node }}
          path: coverage
